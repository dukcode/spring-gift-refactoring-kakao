services:
  postgres:
    image: postgres:15
    container_name: gift-postgres
    environment:
      POSTGRES_DB: gift
      POSTGRES_USER: gift
      POSTGRES_PASSWORD: gift
    ports:
      - "25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gift -d gift"]
      interval: 5s
      timeout: 3s
      retries: 5
